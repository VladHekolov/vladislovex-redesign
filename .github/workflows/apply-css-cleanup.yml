name: Apply CSS cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'agent/css-layer-cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Guard against repeated cleanup
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[cleanup applied\]'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply cleanup
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Load active CSS before first paint instead of injecting it from config.js.
          index_path = root / 'index.html'
          html = index_path.read_text(encoding='utf-8')
          old_link = '  <link rel="stylesheet" href="/assets/css/style.css">'
          new_links = '''  <link rel="stylesheet" href="/assets/css/style.css?v=20260716-2">
          <link rel="stylesheet" href="/assets/css/design-tokens.css?v=20260716-2" data-vh-design-tokens>
          <link rel="stylesheet" href="/assets/css/typography.css?v=20260716-1" data-vh-typography>
          <link rel="stylesheet" href="/assets/css/components.css?v=20260716-1" data-vh-components>
          <link rel="stylesheet" href="/assets/css/themes.css?v=20260716-1" data-vh-themes>
          <link rel="stylesheet" href="/assets/css/icons.css?v=20260716-2" data-vh-icons>
          <link rel="stylesheet" href="/assets/css/home-system.css?v=20260716-1" data-vh-home-system>
          <link rel="stylesheet" href="/assets/css/visual-fixes.css?v=20260716-3" data-vh-visual-fixes>
          <link rel="stylesheet" href="/assets/css/mobile-layout.css?v=20260716-2" data-vh-mobile-layout>
          <link rel="stylesheet" href="/assets/css/mobile-components.css?v=20260716-2" data-vh-mobile-components>
          <link rel="stylesheet" href="/assets/css/mobile-performance.css?v=20260716-2" data-vh-mobile-performance>
          <link rel="stylesheet" href="/assets/css/mobile-tap-color.css?v=20260716-1" data-vh-mobile-tap-color>
          <link rel="stylesheet" href="/assets/css/mobile-carousel-cleanup.css?v=20260716-1" data-vh-mobile-carousel-cleanup>
          <link rel="stylesheet" href="/assets/css/mobile-reviews-stable.css?v=20260716-2" data-vh-mobile-reviews-stable>'''
          if old_link in html:
              html = html.replace(old_link, new_links, 1)

          html = re.sub(
              r'\n\s*<button[^>]*class="[^"]*vh-theme-toggle[^"]*"[^>]*data-vh-theme-toggle[^>]*>.*?</button>\s*',
              '\n', html, flags=re.S
          )
          html = re.sub(
              r'\n\s*<section class="vh-booking" id="booking">.*?</section>\s*',
              '\n', html, count=1, flags=re.S
          )
          html = html.replace('          <a href="#booking">Как проходит заказ</a>\n', '')
          index_path.write_text(html, encoding='utf-8')

          # Config now loads only JavaScript. CSS is synchronous in index.html.
          (root / 'assets/js/config.js').write_text('''/* Public runtime configuration. Never place database passwords or private API keys here. */
          try { localStorage.removeItem('vh-color-theme'); } catch (error) {}
          document.documentElement.setAttribute('data-vh-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';

          window.VLADISLOVEX_CONFIG = Object.freeze({
            apiBaseUrl: 'https://vladhekolov-vocava-platform-0623.twc1.net',
            artistSlug: 'vladislav-hekolov',
            leadEndpoint: '/api/public/leads',
            artistsEndpoint: '/api/public/artists',
            repertoireEndpointTemplate: '/api/public/artists/{artistId}/repertoire',
            publicDataCacheTtlMs: 30000,
            publicDataRequestTimeoutMs: 5500,
            useVocavaApi: true,
            formSubmitFallbackEnabled: true
          });

          (function loadVisualScripts() {
            function loadScript(src, marker, onload) {
              var existing = document.querySelector('script[' + marker + ']');
              if (existing) {
                if (typeof onload === 'function') {
                  if (existing.dataset.loaded === 'true') onload();
                  else existing.addEventListener('load', onload, { once: true });
                }
                return;
              }
              var script = document.createElement('script');
              script.src = src;
              script.setAttribute(marker, '');
              script.addEventListener('load', function () {
                script.dataset.loaded = 'true';
                if (typeof onload === 'function') onload();
              }, { once: true });
              document.head.appendChild(script);
            }

            if (document.body && document.body.id === 'top') {
              loadScript('/assets/js/home-copy.js?v=20260716-1', 'data-vh-home-copy');
              loadScript('/assets/js/mobile-cleanup.js?v=20260716-2', 'data-vh-mobile-cleanup');
              loadScript('/assets/js/mobile-benefits-carousel.js?v=20260716-3', 'data-vh-mobile-benefits');
              loadScript('/assets/js/mobile-video-previews.js?v=20260716-2', 'data-vh-mobile-video-previews');
              loadScript('/assets/js/mobile-reviews-autoplay.js?v=20260716-3', 'data-vh-mobile-reviews-autoplay');
              loadScript('/assets/js/mobile-faq-lite.js?v=20260716-1', 'data-vh-mobile-faq-lite');
            }

            loadScript('/assets/vendor/vh-icons.bundle.js?v=20260716-1', 'data-vh-icon-bundle', function () {
              if (window.VHIcons) loadScript('/assets/js/icons.js?v=20260716-2', 'data-vh-icons-runtime');
            });
          })();
          ''', encoding='utf-8')

          # Remove obsolete Hero values from the source stylesheet itself.
          style_path = root / 'assets/css/style.css'
          style = style_path.read_text(encoding='utf-8')
          style = style.replace('font-size: clamp(72px, 7.1vw, 132px);', 'font-size: clamp(54px, 4.2vw, 76px);')
          style = style.replace('font-size: clamp(46px, 13vw, 68px);', 'font-size: clamp(39px, 10.8vw, 48px);')
          style = re.sub(
              r'(@media \(max-width: 390px\) \{.*?\.vh-hero__title span,\s*\.vh-hero__title strong \{\s*)font-size: 46px;',
              r'\1font-size: clamp(39px, 10.8vw, 44px);',
              style, count=1, flags=re.S
          )
          style_path.write_text(style, encoding='utf-8')

          # Prevent benefits from covering the Hero buttons.
          layout_path = root / 'assets/css/mobile-layout.css'
          layout = layout_path.read_text(encoding='utf-8')
          layout = layout.replace('padding-bottom: 218px !important;', 'padding-bottom: 264px !important;')
          layout = layout.replace('bottom: 16px !important;', 'bottom: 12px !important;')
          layout_path.write_text(layout, encoding='utf-8')

          # Keep only current component overrides.
          (root / 'assets/css/mobile-components.css').write_text('''/* Current mobile component corrections. */
          body#top .vh-video-card__progress { opacity: 0 !important; transition: opacity .2s ease; }
          body#top .vh-video-card.is-previewing .vh-video-card__progress { opacity: 1 !important; }
          body#top .vh-video-card.is-previewing .vh-video-card__progress span { animation-duration: 10s !important; }
          body#top .vh-video-card__preview { opacity: 1 !important; background: #151515; }
          body#top .vh-video-card { -webkit-touch-callout: none; }
          body#top .vh-contact-card[href="/repertoire/"] .vh-contact-card__content > span:last-child {
            font-size: .82rem !important;
            line-height: 1.4 !important;
          }
          @media (max-width: 760px) {
            body#top .vh-contact-card[href="/repertoire/"] .vh-contact-card__content > span:last-child {
              font-size: .76rem !important;
            }
          }
          ''', encoding='utf-8')

          # Final benefit geometry: no masks and enough end space for the clone to align left.
          performance_path = root / 'assets/css/mobile-performance.css'
          performance = performance_path.read_text(encoding='utf-8')
          final_marker = '/* CURRENT BENEFIT LOOP GEOMETRY */'
          if final_marker not in performance:
              performance += '''

          /* CURRENT BENEFIT LOOP GEOMETRY */
          @media (max-width: 860px) {
            body#top .vh-benefits-rail--lite {
              --vh-benefit-card-width: min(72vw, 280px);
              mask-image: none !important;
              -webkit-mask-image: none !important;
              touch-action: pan-x pan-y !important;
            }
            body#top .vh-benefits-rail--lite::before,
            body#top .vh-benefits-rail--lite::after {
              display: none !important;
              content: none !important;
            }
            body#top .vh-benefits-track--lite .vh-benefit-card {
              flex: 0 0 var(--vh-benefit-card-width) !important;
              width: var(--vh-benefit-card-width) !important;
            }
            body#top .vh-benefits-track--lite::after {
              content: "";
              flex: 0 0 max(0px, calc(100vw - var(--vh-benefit-card-width) - var(--vh-home-gutter) - var(--vh-home-gutter)));
            }
          }
          @media (max-width: 390px) {
            body#top .vh-benefits-rail--lite { --vh-benefit-card-width: min(74vw, 270px); }
          }
          '''
          performance_path.write_text(performance, encoding='utf-8')

          # Smooth 4 -> 1 benefits transition using the identical before-clone.
          benefits_path = root / 'assets/js/mobile-benefits-carousel.js'
          benefits = benefits_path.read_text(encoding='utf-8')
          new_go_next = '''    function goNext() {
              var lastOriginal = cloneCount + originalCount - 1;
              if (currentPhysical === lastOriginal) {
                scrollPhysical(0, false);
                requestAnimationFrame(function () {
                  requestAnimationFrame(function () { scrollPhysical(cloneCount, true); });
                });
                clearTimeout(settleTimer);
                settleTimer = setTimeout(function () {
                  currentPhysical = cloneCount;
                  updateState(0);
                }, 560);
                return;
              }
              scrollPhysical(currentPhysical + 1, true);
              clearTimeout(settleTimer);
              settleTimer = setTimeout(settle, 560);
            }

            function schedule'''
          benefits = re.sub(
              r'    function goNext\(\) \{.*?\n    \}\n\n    function schedule',
              new_go_next,
              benefits,
              count=1,
              flags=re.S
          )
          benefits_path.write_text(benefits, encoding='utf-8')

          # Carousel indicators switch immediately; only cards animate.
          reviews_path = root / 'assets/css/mobile-reviews-stable.css'
          reviews = reviews_path.read_text(encoding='utf-8')
          reviews = reviews.replace('transition: width .2s ease, background-color .2s ease !important;', 'transition: none !important;')
          reviews = reviews.replace('touch-action: manipulation;', 'touch-action: pan-x pan-y pinch-zoom !important;')
          reviews_path.write_text(reviews, encoding='utf-8')

          for obsolete in (
              'assets/css/mobile-hotfix.css',
              'assets/js/mobile-review-ratio.js',
              'assets/css/light-theme.css',
              '.cleanup-trigger',
              '.cleanup-trigger-2',
              'CLEANUP_NOTE.md',
          ):
              path = root / obsolete
              if path.exists(): path.unlink()
          PY

      - name: Validate modified source
        if: steps.guard.outputs.run == 'true'
        run: |
          node --check assets/js/config.js
          node --check assets/js/mobile-benefits-carousel.js
          node scripts/design-system-audit.mjs
          grep -q 'data-vh-mobile-reviews-stable' index.html
          ! grep -q 'loadStylesheet' assets/js/config.js
          ! grep -q '132px' assets/css/style.css
          ! test -e assets/css/mobile-hotfix.css
          ! test -e assets/js/mobile-review-ratio.js

      - name: Commit cleanup
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean obsolete CSS layers and fix carousel loops [cleanup applied]"
          git push origin HEAD:${{ github.head_ref }}
