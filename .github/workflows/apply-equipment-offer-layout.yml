name: Apply equipment offer layout
on:
  push:
    branches: [agent/equipment-offer-layout]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/equipment-offer-layout
      - name: Patch equipment offer layout
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('assets/js/app.js')
          css_path = Path('assets/css/offer-refresh.css')
          index_path = Path('index.html')

          app = app_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"    var equipmentTrialHtml = !data\.selectedModel\.equipmentPrice\n.*?\n    : '';",
              re.S,
          )
          replacement = """    var equipmentTrialHtml = !data.selectedModel.equipmentPrice
      ? '<div class=\"vh-offer-equipment-trial\">' +
          '<h3 class=\"vh-offer-equipment-trial-title vh-offer-adv-title\">Попробуйте выступление с оборудованием</h3>' +
          '<span class=\"vh-offer-equipment-trial-icon\" aria-hidden=\"true\">' +
            '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +
              '<path d=\"M11 5 6 9H2v6h4l5 4V5Z\"></path>' +
              '<path d=\"M15.54 8.46a5 5 0 0 1 0 7.07\"></path>' +
              '<path d=\"M19.07 4.93a10 10 0 0 1 0 14.14\"></path>' +
            '</svg>' +
          '</span>' +
          '<div class=\"vh-offer-equipment-trial-copy\">' +
            '<p>Возьму с собой колонку и микрофон.</p>' +
            '<p>Если не зайдет — вы ничего не платите.</p>' +
          '</div>' +
        '</div>'
      : '';"""
          app, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'Equipment trial markup replacement count: {count}')
          app_path.write_text(app, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* Equipment trial mirrors offer-card layout */'
          block = r'''

          /* Equipment trial mirrors offer-card layout */
          .vh-offer-equipment-trial {
            display: grid !important;
            grid-template-columns: 32px minmax(0, 1fr) !important;
            grid-template-areas:
              "title title"
              "icon content" !important;
            column-gap: 11px !important;
            row-gap: 8px !important;
            align-items: start !important;
          }

          .vh-offer-equipment-trial-title {
            grid-area: title;
            width: 100%;
            margin: 0 !important;
            font-size: var(--vh-offer-adv-title-size, 11px) !important;
            line-height: 1.18 !important;
            font-weight: 700 !important;
            letter-spacing: -.01em !important;
            text-align: left !important;
            white-space: nowrap;
          }

          .vh-offer-equipment-trial-icon {
            grid-area: icon;
            align-self: start;
          }

          .vh-offer-equipment-trial-copy {
            grid-area: content;
            min-width: 0;
          }
          '''
          if marker not in css:
              css_path.write_text(css.rstrip() + block, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          replacements = {
              '/assets/css/offer-refresh.css?v=20260716-11': '/assets/css/offer-refresh.css?v=20260716-12',
              '/assets/js/app.js?v=20260716-3': '/assets/js/app.js?v=20260716-4',
          }
          for old, new in replacements.items():
              if old in index:
                  index = index.replace(old, new, 1)
              elif new not in index:
                  raise SystemExit(f'Cache version not found: {old}')
          index_path.write_text(index, encoding='utf-8')
          PY
          node --check assets/js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/css/offer-refresh.css index.html
          git diff --cached --quiet || git commit -m "style: mirror offer layout for equipment trial"
          git push