name: Apply offer price left and icon polish
on:
  push:
    branches: [agent/offer-price-left-icon-polish]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/offer-price-left-icon-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offer-price-left-icon-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch offer PDF styles and markup
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/offer-refresh.css')
          app_path = Path('assets/js/app.js')
          index_path = Path('index.html')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* Offer price left alignment and equipment icon polish */'
          block = r'''

          /* Offer price left alignment and equipment icon polish */
          .vh-offer-card--cost .vh-offer-cost-row > b {
            justify-self: start !important;
            text-align: left !important;
          }

          .vh-offer-card--cost .vh-offer-cost-row--optional > b {
            justify-self: start !important;
          }

          .vh-offer-card--cost .vh-offer-optional-price {
            width: 64px !important;
            text-align: left !important;
          }

          .vh-offer-option > div:last-child {
            position: relative;
            top: 2px;
          }

          .vh-offer-small-info {
            font-size: 9px !important;
          }

          .vh-offer-equipment-trial {
            display: grid !important;
            grid-template-columns: 32px minmax(0, 1fr) !important;
            column-gap: 11px !important;
            align-items: start !important;
          }

          .vh-offer-equipment-trial-icon {
            width: 32px !important;
            height: 32px !important;
            margin-top: 1px;
            border-radius: 9px !important;
          }

          .vh-offer-equipment-trial-icon svg {
            width: 16px !important;
            height: 16px !important;
          }

          .vh-offer-equipment-trial-copy {
            min-width: 0;
          }
          '''
          if marker not in css:
              css_path.write_text(css.rstrip() + block, encoding='utf-8')

          app = app_path.read_text(encoding='utf-8')
          if 'vh-offer-equipment-trial-copy' not in app:
              start_marker = '    var equipmentTrialHtml = !data.selectedModel.equipmentPrice'
              end_marker = '\n\n    pdfStage.innerHTML ='
              start = app.find(start_marker)
              end = app.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Equipment trial block boundaries not found')
              replacement = """    var equipmentTrialHtml = !data.selectedModel.equipmentPrice
              ? '<div class=\"vh-offer-equipment-trial\">' +
                  '<span class=\"vh-offer-equipment-trial-icon\" aria-hidden=\"true\"><i data-vh-icon=\"mic-2\"></i></span>' +
                  '<div class=\"vh-offer-equipment-trial-copy\">' +
                    '<h3>Попробуйте выступление с оборудованием</h3>' +
                    '<p>Возьму с собой колонку и микрофон.</p>' +
                    '<p>Если не зайдет — вы ничего не платите.</p>' +
                  '</div>' +
                '</div>'
              : '';"""
              app_path.write_text(app[:start] + replacement + app[end:], encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old_version = '/assets/css/offer-refresh.css?v=20260716-10'
          new_version = '/assets/css/offer-refresh.css?v=20260716-11'
          if old_version in index:
              index_path.write_text(index.replace(old_version, new_version, 1), encoding='utf-8')
          elif new_version not in index:
              raise SystemExit('Stylesheet version not found')
          PY
          node --check assets/js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/offer-refresh.css assets/js/app.js index.html
          git diff --cached --quiet || git commit -m "style: align offer prices and add equipment icon"
          git push origin HEAD:agent/offer-price-left-icon-polish