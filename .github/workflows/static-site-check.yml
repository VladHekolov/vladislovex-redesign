name: Static site check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/theme.js
          node --check assets/js/config.js
          node --check assets/js/icons.js
          node --check assets/js/artist-modal.js
          node --check assets/js/repertoire.js
          node --check assets/vendor/vh-icons.bundle.js
          node --check scripts/design-system-audit.mjs

      - name: Verify shared design assets
        run: |
          test -f assets/css/design-tokens.css
          test -f assets/css/typography.css
          test -f assets/css/components.css
          test -f assets/css/themes.css
          test -f assets/css/icons.css
          test -f assets/css/artist-modal.css
          test -f scripts/design-system-audit.mjs
          grep -q 'data-vh-theme="dark"' artists/index.html
          grep -q 'data-vh-theme="dark"' repertoire/index.html
          grep -q '/assets/js/theme.js' artists/index.html
          grep -q '/assets/js/theme.js' repertoire/index.html
          grep -q '/assets/css/typography.css' artists/index.html
          grep -q '/assets/css/typography.css' repertoire/index.html
          grep -q '/assets/css/components.css' artists/index.html
          grep -q '/assets/css/components.css' repertoire/index.html
          grep -q '/assets/css/themes.css' artists/index.html
          grep -q '/assets/css/themes.css' repertoire/index.html
          grep -q '/assets/css/typography.css' assets/js/config.js
          grep -q '/assets/css/components.css' assets/js/config.js

      - name: Verify design system contract
        run: |
          grep -q -- '--vh-weight-button' assets/css/design-tokens.css
          grep -q -- '--vh-control-height-lg' assets/css/design-tokens.css
          grep -q -- '--vh-page-gutter' assets/css/design-tokens.css
          grep -q '^\.vh-button' assets/css/components.css
          grep -q '^\.vh-title' assets/css/components.css
          grep -q '^\.vh-card' assets/css/components.css
          grep -q 'vh-title--page' artists/index.html
          grep -q 'vh-title--page' repertoire/index.html
          grep -q 'vh-button--primary' artists/index.html
          grep -q 'vh-button--primary' repertoire/index.html

      - name: Audit local CSS overrides
        run: node scripts/design-system-audit.mjs

      - name: Verify repertoire artist popup
        run: |
          grep -q 'data-vh-artist-modal-trigger' repertoire/index.html
          grep -q 'id="vhRepertoireArtistModal"' repertoire/index.html
          grep -q '/assets/css/artist-modal.css' repertoire/index.html
          grep -q '/assets/js/artist-modal.js' repertoire/index.html
          ! grep -q 'id="vrArtistCard" href="/artists/' repertoire/index.html

      - name: Reject external icon CDN dependencies
        run: |
          ! grep -R "unpkg.com/lucide\|cdn.jsdelivr.net/npm/lucide" assets index.html artists repertoire
