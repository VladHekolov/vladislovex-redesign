name: Visual audit artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact site source
        run: |
          zip -r vladislovex-site-source.zip . \
            -x '.git/*' \
            -x 'vladislovex-site-source.zip'
      - name: Upload site source
        uses: actions/upload-artifact@v4
        with:
          name: vladislovex-site-source
          path: vladislovex-site-source.zip
          retention-days: 1
